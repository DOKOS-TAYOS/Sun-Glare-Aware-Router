name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Pyright
        run: python -m pyright

      - name: Run tests
        run: python -m pytest

  required-pr-ci:
    name: ${{ github.event_name == 'pull_request' && 'required-pr-ci' || 'push-ci-summary' }}
    if: ${{ always() }}
    needs:
      - checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate required jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          set -euo pipefail

          if [[ "${CHECKS_RESULT}" != "success" ]]; then
            echo "Required job checks finished with '${CHECKS_RESULT}', expected success."
            exit 1
          fi

          echo "All required jobs passed."
